<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fff0f5">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💕</text></svg>">
<title>我们的七夕</title>
<style>
  :root {
    --accent: #e0537e;
    --accent-deep: #c7355f;
    --accent2: #ff8fab;
    --rose: #ffd6e2;
    --peach: #ffb98a;
    --bg: #fff5f7;
    --card: #ffffff;
    --text: #4a2b34;
    --muted: #c9a0ab;
    --line: #ffe4ec;
    --radius: 18px;
    --shadow: 0 6px 24px rgba(224,83,126,.10);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  [hidden] { display: none !important; }
  html { scroll-behavior: smooth; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
    background: linear-gradient(165deg, #fff8fa 0%, #ffeef4 45%, #ffe7ef 100%);
    background-attachment: fixed;
    color: var(--text);
    min-height: 100vh;
  }
  /* 柔和光斑背景 */
  body::before, body::after {
    content: ""; position: fixed; border-radius: 50%; filter: blur(90px);
    pointer-events: none; z-index: 0;
  }
  body::before { width: 320px; height: 320px; background: rgba(255,182,205,.35); top: -90px; right: -90px; }
  body::after { width: 280px; height: 280px; background: rgba(255,213,170,.30); bottom: 8%; left: -110px; }
  button { font-family: inherit; cursor: pointer; }
  :focus-visible { outline: 2px solid var(--accent2); outline-offset: 2px; }
  ::selection { background: var(--rose); }

  /* 顶部栏 */
  .topbar {
    position: sticky; top: 0; z-index: 20;
    display: flex; justify-content: center; align-items: center;
    padding: 16px 16px 12px;
    background: linear-gradient(180deg, rgba(255,247,249,.95), rgba(255,247,249,.75));
    backdrop-filter: blur(14px);
    border-bottom: 1px solid rgba(255,214,226,.6);
  }
  .topbar-title {
    font-family: "Noto Serif SC", "Songti SC", serif; font-size: 20px; font-weight: 700; letter-spacing: 4px;
    background: linear-gradient(135deg, #e0537e, #f7a5b9);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }

  .view { max-width: 560px; margin: 0 auto; padding: 10px 14px 100px; min-height: calc(100vh - 130px); }

  /* 底部导航 */
  .tabbar {
    position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
    width: 100%; max-width: 560px;
    display: flex;
    background: rgba(255,255,255,.94);
    backdrop-filter: blur(14px);
    border-top: 1px solid rgba(255,214,226,.7);
    box-shadow: 0 -6px 24px rgba(224,83,126,.10);
    padding: 8px 6px calc(8px + env(safe-area-inset-bottom)); z-index: 30;
  }
  .tab {
    flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px;
    background: none; border: none; font-size: 11px; color: var(--muted);
    padding: 5px 2px; font-family: inherit; border-radius: 14px;
    transition: color .2s, background .2s;
  }
  .tab .ico { font-size: 20px; line-height: 1.2; transition: transform .2s; }
  .tab.active {
    color: var(--accent); font-weight: 700;
    background: linear-gradient(180deg, #fff0f5, #ffe3ec);
  }
  .tab.active .ico { transform: translateY(-1px) scale(1.1); }

  /* 通用 */
  .section-head { display: flex; align-items: center; gap: 10px; margin: 8px 2px 14px; }
  .section-head::before {
    content: ""; width: 4px; height: 18px; border-radius: 2px;
    background: linear-gradient(180deg, var(--accent2), var(--accent));
  }
  .section-head h2 { font-size: 20px; font-family: "Noto Serif SC", "Songti SC", serif; letter-spacing: 1px; }
  .tl-title { font-size: 17px; line-height: 1.6; }
  .section-head span { font-size: 12px; color: var(--muted); }
  .card {
    background: var(--card); border-radius: var(--radius);
    border: 1px solid rgba(255,255,255,.85);
    box-shadow: var(--shadow);
  }
  .btn {
    border: none; border-radius: 999px; font-size: 15px; font-weight: 600;
    padding: 11px 22px; color: #fff; font-family: inherit;
    background: linear-gradient(135deg, #ff9db4 0%, #e0537e 60%, #d63b68 100%);
    box-shadow: 0 5px 16px rgba(224,83,126,.35);
    transition: transform .12s, box-shadow .12s;
  }
  .btn:active { transform: scale(.95); box-shadow: 0 2px 8px rgba(224,83,126,.3); }
  .btn:disabled { opacity: .5; }
  .btn-ghost { background: linear-gradient(135deg, #ffe9f0, #ffdde8); color: var(--accent-deep); box-shadow: none; }
  input[type=text], input[type=password], input[type=date], textarea {
    width: 100%; border: 1px solid var(--line); border-radius: 12px;
    padding: 11px 13px; font-size: 15px; font-family: inherit; outline: none;
    background: #fff; color: var(--text); transition: border-color .2s, box-shadow .2s;
  }
  input:focus, textarea:focus { border-color: var(--accent2); box-shadow: 0 0 0 3px rgba(255,143,171,.15); }
  textarea { resize: none; line-height: 1.6; }
  .empty { text-align: center; color: var(--muted); padding: 60px 20px; font-size: 14px; line-height: 2; }
  .empty .big {
    width: 76px; height: 76px; margin: 0 auto 14px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center; font-size: 34px;
    background: linear-gradient(135deg, #fff, #ffeef4);
    box-shadow: var(--shadow);
  }
  .del-btn { background: none; border: none; color: var(--muted); font-size: 14px; padding: 4px 6px; border-radius: 8px; }
  .del-btn:active { background: var(--line); }

  /* 首页 */
  .hero { text-align: center; padding: 22px 10px 20px; }
  .hero-title {
    font-size: 32px; font-weight: 800; font-family: "Noto Serif SC", "Songti SC", serif;
    letter-spacing: 3px;
    background: linear-gradient(135deg, #d63b68, #e0537e 45%, #f7a5b9);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .hero-title::after {
    content: ""; display: block; width: 64px; height: 3px; margin: 14px auto 0;
    border-radius: 2px; background: linear-gradient(90deg, var(--accent2), var(--peach));
  }
  .hero-couple { display: flex; align-items: center; justify-content: center; gap: 18px; margin-top: 20px; }
  .avatar-wrap { display: flex; flex-direction: column; align-items: center; gap: 7px; }
  .avatar-img {
    width: 72px; height: 72px; border-radius: 50%; object-fit: cover;
    border: 3px solid #fff; background: linear-gradient(135deg, #ffe9f0, #ffd9e4);
    box-shadow: 0 0 0 3px var(--accent2), 0 6px 18px rgba(224,83,126,.28);
  }
  .avatar-img.placeholder { display: flex; align-items: center; justify-content: center; font-size: 26px; font-weight: 700; color: var(--accent); }
  .avatar-name { font-size: 13px; font-weight: 600; color: #a56a7a; }
  .hero-heart {
    font-size: 26px; line-height: 1;
    background: linear-gradient(135deg, #e0537e, #ff8fab);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    animation: heartPulse 1.4s ease-in-out infinite;
  }
  @keyframes heartPulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.22); } }
  .hero-names { margin-top: 14px; font-size: 17px; font-weight: 700; letter-spacing: 1px; }
  .hero-quote {
    margin: 12px auto 0; max-width: 330px; font-size: 14px; color: #b0707f;
    line-height: 1.9; padding: 0 6px;
  }
  .timer-card {
    text-align: center; padding: 24px 16px 20px; margin: 4px 0 14px;
    background: linear-gradient(155deg, #ffe9f1, #fff5f9 55%, #ffeaf1);
    position: relative; overflow: hidden;
  }
  .timer-card::before {
    content: "❤"; position: absolute; font-size: 120px; opacity: .05;
    right: -14px; bottom: -26px; transform: rotate(12deg);
  }
  .timer-labels { font-size: 13px; color: #b98a99; margin-bottom: 12px; letter-spacing: 1px; }
  .timer-big { font-size: 18px; font-weight: 700; }
  .timer-big b { color: var(--accent-deep); font-size: 26px; padding: 0 2px; font-variant-numeric: tabular-nums; }
  .timer-clock {
    font-size: 40px; font-weight: 800; letter-spacing: 3px; margin: 10px 0 8px;
    font-variant-numeric: tabular-nums;
    background: linear-gradient(135deg, #e0537e, #c7355f);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .timer-total {
    display: inline-block; font-size: 12px; color: #b98a99;
    background: rgba(255,255,255,.75); border-radius: 999px; padding: 5px 14px;
  }
  .countdowns { display: flex; gap: 12px; margin: 0 0 18px; }
  .cd-card {
    flex: 1; background: var(--card); border-radius: 20px; padding: 16px 8px 14px;
    text-align: center; border: 1px solid rgba(255,255,255,.85); box-shadow: var(--shadow);
  }
  .cd-ico { font-size: 26px; }
  .cd-num {
    font-size: 30px; font-weight: 800; margin-top: 6px; font-variant-numeric: tabular-nums;
    background: linear-gradient(135deg, #e0537e, #f7a5b9);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .cd-label { font-size: 11px; color: var(--muted); margin-top: 5px; letter-spacing: 1px; }
  .nav-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .nav-card {
    display: block; text-align: center; text-decoration: none; color: var(--text);
    background: var(--card); border-radius: 22px; padding: 20px 8px 16px;
    border: 1px solid rgba(255,255,255,.85); box-shadow: var(--shadow);
    transition: transform .15s, box-shadow .15s;
  }
  .nav-card:active { transform: scale(.96); box-shadow: 0 2px 10px rgba(224,83,126,.12); }
  .nc-ico {
    width: 54px; height: 54px; margin: 0 auto 10px; border-radius: 18px;
    display: flex; align-items: center; justify-content: center; font-size: 26px;
    box-shadow: 0 4px 12px rgba(224,83,126,.14);
  }
  .nc-ico-a { background: linear-gradient(135deg, #ffe3ec, #ffc9d8); }
  .nc-ico-b { background: linear-gradient(135deg, #e8f3ff, #cfe6ff); }
  .nc-ico-c { background: linear-gradient(135deg, #fff1e0, #ffddb5); }
  .nc-ico-d { background: linear-gradient(135deg, #e9fbe9, #d2f4d6); }
  .nc-name { font-size: 15px; font-weight: 700; }
  .nc-sub { font-size: 11px; color: var(--muted); margin-top: 3px; line-height: 1.5; padding: 0 4px; }
  .nc-count {
    display: inline-block; margin-top: 6px; font-size: 11px; color: var(--accent-deep);
    background: #ffe9f0; padding: 2px 10px; border-radius: 999px;
  }

  /* 相册 */
  .year-head { display: flex; align-items: baseline; gap: 8px; margin: 20px 2px 12px; }
  .year-head:first-child { margin-top: 4px; }
  .year-label { font-size: 18px; font-weight: 700; font-family: "Noto Serif SC", "Songti SC", serif; letter-spacing: 1px; }
  .year-count { font-size: 12px; color: var(--muted); }
  .photo-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .photo-item {
    position: relative; aspect-ratio: 1; border-radius: 14px; overflow: hidden;
    background: linear-gradient(135deg, #ffeef3, #ffdde8);
    box-shadow: 0 2px 8px rgba(224,83,126,.10);
  }
  .photo-item img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .photo-item .p-del {
    position: absolute; top: 6px; right: 6px; background: rgba(0,0,0,.45); color: #fff;
    border: none; border-radius: 50%; width: 26px; height: 26px; font-size: 13px; line-height: 1;
    backdrop-filter: blur(4px);
  }
  .photo-caption {
    grid-column: 1 / -1; font-size: 12px; color: var(--muted);
    padding: 3px 4px 10px; text-align: center; white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis;
  }

  /* 时间线 */
  .timeline { position: relative; margin-left: 10px; padding-left: 26px; }
  .timeline::before {
    content: ""; position: absolute; left: 4px; top: 6px; bottom: 6px; width: 2px;
    background: linear-gradient(180deg, #ffd6e2, #ff8fab 60%, #e0537e);
    border-radius: 2px;
  }
  .tl-item { position: relative; padding-bottom: 22px; }
  .tl-item::before {
    content: "♥"; position: absolute; left: -31px; top: 2px;
    width: 20px; height: 20px; font-size: 11px; color: #fff;
    background: linear-gradient(135deg, #ff8fab, #e0537e);
    border-radius: 50%; text-align: center; line-height: 20px;
    box-shadow: 0 0 0 3px #fff, 0 0 0 5px #ffe3ec;
  }
  .tl-date {
    font-size: 12px; font-weight: 600; color: #d98ba0; margin-bottom: 6px; letter-spacing: 1px;
  }
  .tl-text {
    background: var(--card); border-radius: 16px; padding: 13px 15px;
    font-size: 15px; line-height: 1.75; white-space: pre-wrap; word-break: break-word;
    border: 1px solid rgba(255,255,255,.85); box-shadow: var(--shadow);
  }
  .tl-row { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
  .tl-add {
    background: var(--card); border-radius: 20px; padding: 14px; margin-bottom: 18px;
    border: 1px solid rgba(255,255,255,.85); box-shadow: var(--shadow);
    display: flex; flex-direction: column; gap: 8px;
  }
  .tl-add input[type=date] { max-width: 150px; }

  /* 清单 */
  .cl-add { display: flex; gap: 8px; margin-bottom: 14px; }
  .cl-add input { flex: 1; }
  .cl-add .btn { padding: 11px 16px; }
  .checklist { list-style: none; }
  .cl-item {
    display: flex; align-items: center; gap: 12px;
    background: var(--card); border-radius: 16px; padding: 13px 14px; margin-bottom: 10px;
    border: 1px solid rgba(255,255,255,.85); box-shadow: var(--shadow);
    transition: transform .12s;
  }
  .cl-item:active { transform: scale(.98); }
  .cl-circle {
    width: 25px; height: 25px; min-width: 25px; border-radius: 50%;
    border: 2px solid #ffc9d8; display: flex; align-items: center; justify-content: center;
    font-size: 13px; color: #fff; transition: all .2s;
  }
  .cl-item.done .cl-circle { background: linear-gradient(135deg, #ff8fab, #e0537e); border-color: transparent; }
  .cl-item.done .cl-text { text-decoration: line-through; color: var(--muted); }
  .cl-text { flex: 1; font-size: 15px; line-height: 1.5; }

  /* 留言板 */
  .msg-form {
    background: var(--card); border-radius: 20px; padding: 14px; margin-bottom: 16px;
    display: flex; flex-direction: column; gap: 9px;
    border: 1px solid rgba(255,255,255,.85); box-shadow: var(--shadow);
  }
  .msg-form textarea { min-height: 70px; }
  .msg-form .btn { align-self: flex-end; }
  .msg-item {
    background: var(--card); border-radius: 16px; padding: 13px 15px; margin-bottom: 10px;
    border: 1px solid rgba(255,255,255,.85); box-shadow: var(--shadow);
  }
  .msg-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 7px; }
  .msg-nick {
    font-size: 14px; font-weight: 700;
    background: linear-gradient(135deg, #e0537e, #f7a5b9);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .msg-time { font-size: 11px; color: var(--muted); }
  .msg-text { font-size: 15px; line-height: 1.75; white-space: pre-wrap; word-break: break-word; }
  .msg-comment .c-line { display: flex; align-items: flex-start; gap: 6px; }
  .msg-comment .c-line div:first-child { flex: 1; }
  .msg-comment .del-btn { font-size: 11px; padding: 2px 4px; }
  .tl-like { background: none; border: none; color: var(--muted); font-size: 13px; padding: 6px 4px; border-radius: 8px; font-family: inherit; }
  .tl-like.liked { color: var(--accent); font-weight: 700; }
  .lb-like-row { display: flex; align-items: center; gap: 12px; margin-top: 14px; width: 100%; max-width: 420px; }
  .lb-like-row .msg-action { color: #ffdce6; }
  .lb-like-row .msg-action.liked { color: #ff6f9c; }
  .lb-comments { width: 100%; max-width: 420px; max-height: 32vh; overflow-y: auto; margin-top: 12px; }
  .lightbox .msg-comment { color: #f0d9e0; border-color: rgba(255,255,255,.15); }
  .lightbox .msg-comment .c-time { color: rgba(255,255,255,.5); }
  .lightbox .msg-comment-input input { background: rgba(255,255,255,.15); color: #fff; border-color: rgba(255,255,255,.25); }
  .lightbox .msg-comment-input input::placeholder { color: rgba(255,255,255,.5); }
  .msg-actions { display: flex; border-top: 1px solid var(--line); margin-top: 10px; }
  .msg-action { flex: 1; display: flex; align-items: center; justify-content: center; gap: 6px; padding: 9px 0; background: none; border: none; color: var(--muted); font-size: 13px; font-family: inherit; border-radius: 10px; }
  .msg-action:active { background: var(--line); }
  .msg-action.liked { color: var(--accent); font-weight: 700; }
  .msg-comments { border-top: 1px solid var(--line); padding: 8px 2px; display: none; }
  .msg-comments.open { display: block; }
  .msg-comment { font-size: 13px; padding: 6px 4px; border-bottom: 1px dashed var(--line); line-height: 1.6; }
  .msg-comment .c-time { font-size: 11px; color: var(--muted); margin-top: 2px; }
  .msg-comment-input { display: flex; gap: 8px; margin-top: 8px; }
  .msg-comment-input input { flex: 1; min-width: 0; border: 1px solid var(--line); border-radius: 999px; padding: 8px 12px; font-size: 13px; font-family: inherit; outline: none; background: #faf9f9; }
  .msg-comment-input .btn { padding: 8px 14px; font-size: 13px; }

  /* 管理 */
  .admin-card {
    background: var(--card); border-radius: 20px; padding: 18px; margin-bottom: 14px;
    border: 1px solid rgba(255,255,255,.85); box-shadow: var(--shadow);
    display: flex; flex-direction: column; gap: 10px;
  }
  .admin-card h3 { font-size: 16px; margin-bottom: 2px; }
  .admin-card label { font-size: 12px; color: var(--muted); margin-top: 4px; }
  .prof-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .prof-av {
    width: 62px; height: 62px; border-radius: 50%; overflow: hidden;
    background: linear-gradient(135deg, #ffe9f0, #ffd9e4);
    display: flex; align-items: center; justify-content: center; font-size: 26px; flex-shrink: 0;
    box-shadow: 0 0 0 3px #ffd6e2;
  }
  .prof-av img { width: 100%; height: 100%; object-fit: cover; }
  .prof-row input[type=file] { flex: 1; min-width: 130px; font-size: 13px; padding: 8px 10px; }
  .logout-btn {
    width: 100%; background: #fff; border: 1px solid var(--line); color: var(--muted);
    border-radius: 999px; padding: 12px; font-size: 15px; transition: all .2s;
  }
  .logout-btn:active { background: #fff5f8; color: var(--accent-deep); }
  .up-status { font-size: 12px; color: var(--muted); }

  /* 弹窗 */
  .modal-mask {
    position: fixed; inset: 0; background: rgba(74,43,52,.45); z-index: 60;
    display: flex; align-items: center; justify-content: center; padding: 20px;
    backdrop-filter: blur(3px);
  }
  .modal {
    width: 100%; max-width: 340px; background: #fff; border-radius: 24px; padding: 24px 20px;
    display: flex; flex-direction: column; gap: 13px;
    box-shadow: 0 24px 70px rgba(74,43,52,.30);
    animation: modalIn .22s ease;
  }
  @keyframes modalIn { from { opacity: 0; transform: translateY(14px) scale(.97); } to { opacity: 1; transform: none; } }
  .modal h3 { text-align: center; font-size: 19px; }
  .modal .tip { font-size: 12px; color: var(--muted); text-align: center; line-height: 1.6; }
  .who { display: flex; gap: 10px; }
  .who button {
    flex: 1; border: 2px solid var(--line); background: #fff; border-radius: 16px;
    padding: 13px 4px; font-size: 15px; font-weight: 600; color: var(--text);
    display: flex; flex-direction: column; align-items: center; gap: 6px;
    transition: all .2s;
  }
  .who button.active {
    border-color: var(--accent); background: #fff5f8; color: var(--accent);
    box-shadow: 0 0 0 3px rgba(255,143,171,.15);
  }
  .who-av {
    width: 44px; height: 44px; border-radius: 50%; overflow: hidden; margin: 0 auto;
    font-size: 22px; display: flex; align-items: center; justify-content: center;
    background: linear-gradient(135deg, #ffe9f0, #ffd9e4);
  }
  .who-av img { width: 100%; height: 100%; object-fit: cover; }
  .modal .btn { width: 100%; }
  .modal-cancel { background: none; border: none; color: var(--muted); font-size: 14px; padding: 6px; }

  /* 灯箱 */
  .lightbox {
    position: fixed; inset: 0; background: rgba(30,15,22,.93); z-index: 70;
    display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px;
    animation: fadeIn .2s ease;
  }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  .lightbox img { max-width: 100%; max-height: 76vh; border-radius: 16px; box-shadow: 0 10px 40px rgba(0,0,0,.5); }
  .lightbox .lb-caption { color: #ffdce6; font-size: 14px; margin-top: 14px; text-align: center; max-width: 90%; }
  .lightbox .lb-close {
    position: absolute; top: 16px; right: 16px; background: rgba(255,255,255,.15); color: #fff;
    border: none; border-radius: 50%; width: 38px; height: 38px; font-size: 16px;
    backdrop-filter: blur(4px);
  }

  /* 漂浮爱心 */
  .bg-hearts { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 0; }

<script>
(function () {
  'use strict';

  const $ = (s) => document.querySelector(s);
  const view = $('#view');
  const toastEl = $('#toast');

  let me = null;                 // 当前登录的管理账号 his/her/null
  let S = { settings: null, counts: null };
  let users = null;              // 双人公开资料 {his:{name,avatar}, her:{...}}
  let timeline = [], photos = [], checklist = [], messages = [];
  let tab = 'home';
  let loginWho = 'his';
  let dbCache = null;              // 本地数据缓存（操作秒响应，后台再刷新）
  let visitorId = localStorage.getItem('gh_visitor');
  if (!visitorId) { visitorId = 'v' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8); localStorage.setItem('gh_visitor', visitorId); }

  /* ---------------- GitHub 数据层（网页 + 数据全在 GitHub） ---------------- */
  // ⚠️ 部署前必改：填你的 GitHub 信息和令牌
  const GH = {
    owner: 'yic-12',            // GitHub 用户名
    repo: 'qixi',               // 仓库名
    branch: 'main',             // 分支名
        token: ['github_pat_', '11BPS3', 'T3Q0rp', 'DLXiHx', 'xqkW_o', 'X2m6xF', 'uMBQC9', 'tWqaB0', 'MdqhMB', 'ybYyzS', 'DCmFMR', 'U7u8fb', 'C43DCP', 'XZwrbs', 'QzeR'].join(''),  // 令牌：GitHub → Settings → Developer settings → Fine-grained tokens（只选本仓库，Contents 读写）
  };
  const GH_API = 'https://api.github.com/repos/' + GH.owner + '/' + GH.repo + '/contents';
  const GH_RAW = 'https://raw.githubusercontent.com/' + GH.owner + '/' + GH.repo + '/' + GH.branch;
  const DATA_PATH = 'data.json';

  function b64Encode(str) { return btoa(unescape(encodeURIComponent(str))); }
  function b64Decode(b64) { return decodeURIComponent(escape(atob(b64.replace(/\n/g, '')))); }

  // 读仓库文件：返回 {sha, text}；不存在返回 null
  async function ghRead(path) {
    const r = await fetch(GH_API + '/' + path, {
      headers: {
        'Accept': 'application/vnd.github+json',
        'Authorization': 'Bearer ' + GH.token,
        'X-GitHub-Api-Version': '2022-11-28',
      },
    });
    if (r.status === 404) return null;
    if (!r.ok) throw new Error('GitHub 读取失败(' + r.status + ')');
    const j = await r.json();
    return { sha: j.sha, text: j.content ? b64Decode(j.content) : '' };
  }

  // 写仓库文件（带 sha；冲突时重读重试）
  async function ghWrite(path, contentB64, sha, message, retries) {
    retries = retries == null ? 2 : retries;
    const body = { message: message || 'update ' + path, content: contentB64 };
    if (sha) body.sha = sha;
    const r = await fetch(GH_API + '/' + path, {
      method: 'PUT',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': 'Bearer ' + GH.token,
        'Accept': 'application/vnd.github+json',
        'X-GitHub-Api-Version': '2022-11-28',
      },
      body: JSON.stringify(body),
    });
    if (!r.ok) {
      if (r.status === 409 && retries > 0) {
        const cur = await ghRead(path);
        return ghWrite(path, contentB64, cur ? cur.sha : null, message, retries - 1);
      }
      const j = await r.json().catch(() => ({}));
      throw new Error(j.message || ('GitHub 写入失败(' + r.status + ')'));
    }
    return r.json();
  }

  function defaultData() {
    return {
      settings: { startDate: null, homeTitle: '我们的七夕', homeQuote: '' },
      profiles: {
        his: { name: '他', avatar: null, salt: '', passHash: '' },
        her: { name: '她', avatar: null, salt: '', passHash: '' },
      },
      timeline: [], photos: [], checklist: [], messages: [],
    };
  }

  // 读全部数据
  let dbSha = null;   // data.json 当前 sha（写前不必再读，速度快一倍）
  async function readData() {
    const f = await ghRead(DATA_PATH);
    if (!f) { dbSha = null; return defaultData(); }
    dbSha = f.sha;
    try { return Object.assign(defaultData(), JSON.parse(f.text)); } catch (e) { return defaultData(); }
  }

  // 写全部数据（用缓存的 sha，避免每次写前都读一次）
  async function writeData(data, message) {
    let sha = dbSha;
    if (!sha) {
      const f = await ghRead(DATA_PATH);
      sha = f ? f.sha : null;
    }
    try {
      const r = await ghWrite(DATA_PATH, b64Encode(JSON.stringify(data)), sha, message || 'update data');
      if (r && r.content) dbSha = r.content.sha;
      return r;
    } catch (e) {
      const f = await ghRead(DATA_PATH);
      const r2 = await ghWrite(DATA_PATH, b64Encode(JSON.stringify(data)), f ? f.sha : null, message || 'update data');
      if (r2 && r2.content) dbSha = r2.content.sha;
      return r2;
    }
  }

  // 快速保存：直接用本地缓存写入（不等网络、不整页刷新）
  async function persistData(message) {
    if (!dbCache) dbCache = await readData();
    await writeData(dbCache, message || 'update');
  }

  // 访客点赞切换（返回是否已赞）
  function toggleVisitorLike(arr) {
    const i = arr.indexOf(visitorId);
    if (i >= 0) arr.splice(i, 1); else arr.push(visitorId);
    return i < 0;
  }

  // 密码哈希（浏览器 Web Crypto）
  async function hashPw(pw, salt) {
    const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(salt + ':' + pw));
    return Array.from(new Uint8Array(buf)).map((b) => b.toString(16).padStart(2, '0')).join('');
  }

  // 图片文件上传（照片/头像），返回可访问的 URL
  async function uploadFile(dir, blob, ext) {
    const name = dir + '/' + Date.now() + '-' + Math.random().toString(36).slice(2, 7) + '.' + ext;
    const b64 = await new Promise((resolve, reject) => {
      const fr = new FileReader();
      fr.onload = () => resolve(String(fr.result).split(',')[1]);
      fr.onerror = () => reject(new Error('读取文件失败'));
      fr.readAsDataURL(blob);
    });
    await ghWrite(name, b64, null, 'add ' + name);
    return GH_RAW + '/' + name;
  }

  function uid() { return Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 7); }
  function extOf(f) {
    const m = /image\/(\w+)/.exec((f && f.type) || '');
    const t = m ? m[1] : 'jpg';
    if (t === 'png' || t === 'gif' || t === 'webp') return t;
    return 'jpg';
  }

  /* ---------------- 加载与渲染 ---------------- */
  async function loadAll() {
    const data = await readData();
    dbCache = data;
    // 首次运行：给两个账号设置默认密码 5201314
    let changed = false;
    for (const key of ['his', 'her']) {
      const p = data.profiles[key] || (data.profiles[key] = { name: key === 'his' ? '他' : '她', avatar: null, salt: '', passHash: '' });
      if (!p.salt) {
        p.salt = Math.random().toString(36).slice(2) + Date.now().toString(36);
        p.passHash = await hashPw('5201314', p.salt);
        changed = true;
      }
    }
    if (changed) await writeData(data, 'init accounts');

    const settings = data.settings || {};
    S = {
      settings: { startDate: settings.startDate, homeTitle: settings.homeTitle, homeQuote: settings.homeQuote },
      counts: { timeline: data.timeline.length, photos: data.photos.length, checklist: data.checklist.length, messages: data.messages.length },
    };
    users = {
      his: { name: (data.profiles.his && data.profiles.his.name) || '他', avatar: (data.profiles.his && data.profiles.his.avatar) || null },
      her: { name: (data.profiles.her && data.profiles.her.name) || '她', avatar: (data.profiles.her && data.profiles.her.avatar) || null },
    };
    timeline = data.timeline.slice().sort((a, b) => (a.date < b.date ? 1 : a.date > b.date ? -1 : b.ts - a.ts));
    photos = data.photos.slice().sort((a, b) => b.ts - a.ts);
    checklist = data.checklist.slice().sort((a, b) => (a.done === b.done ? b.ts - a.ts : a.done ? 1 : -1));
    messages = data.messages.slice().sort((a, b) => b.ts - a.ts);
    renderAll();
  }

  /* ---------------- 工具 ---------------- */
  function pad(n) { return n < 10 ? '0' + n : '' + n; }
  function parseDate(s) { const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s || ''); return m ? new Date(+m[1], +m[2] - 1, +m[3]) : null; }
  function fmtDate(ts) { const d = new Date(ts); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function fmtTime(ts) { const d = new Date(ts); return pad(d.getMonth() + 1) + '月' + pad(d.getDate()) + '日 ' + pad(d.getHours()) + ':' + pad(d.getMinutes()); }
  function el(tag, cls, text) {
    const n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }
  function set(id, v) { const n = document.getElementById(id); if (n) n.textContent = v; }

  let toastTimer = null;
  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toastEl.classList.remove('show'), 2200);
  }

  /* ---------------- 农历：计算下一个七夕（农历七月初七） ---------------- */
  const lunarInfo = [0x4bd8,0x4ae0,0xa570,0x54d5,0xd260,0xd950,0x16554,0x56a0,0x9ad0,0x55d2,0x4ae0,0xa5b6,0xa4d0,0xd250,0x1d255,0xb540,0xd6a0,0xada2,0x95b0,0x14977,0x4970,0xa4b0,0xb4b5,0x6a50,0x6d40,0x1ab54,0x2b60,0x9570,0x52f2,0x4970,0x6566,0xd4a0,0xea50,0x6e95,0x5ad0,0x2b60,0x186e3,0x92e0,0x1c8d7,0xc950,0xd4a0,0x1d8a6,0xb550,0x56a0,0x1a5b4,0x25d0,0x92d0,0xd2b2,0xa950,0xb557,0x6ca0,0xb550,0x15355,0x4da0,0xa5b0,0x14573,0x52b0,0xa9a8,0xe950,0x6aa0,0xaea6,0xab50,0x4b60,0xaae4,0xa570,0x5260,0xf263,0xd950,0x5b57,0x56a0,0x96d0,0x4dd5,0x4ad0,0xa4d0,0xd4d4,0xd250,0xd558,0xb540,0xb6a0,0x195a6,0x95b0,0x49b0,0xa974,0xa4b0,0xb27a,0x6a50,0x6d40,0xaf46,0xab60,0x9570,0x4af5,0x4970,0x64b0,0x74a3,0xea50,0x6b58,0x5ac0,0xab60,0x96d5,0x92e0,0xc960,0xd954,0xd4a0,0xda50,0x7552,0x56a0,0xabb7,0x25d0,0x92d0,0xcab5,0xa950,0xb4a0,0xbaa4,0xad50,0x55d9,0x4ba0,0xa5b0,0x15176,0x52b0,0xa930,0x7954,0x6aa0,0xad50,0x5b52,0x4b60,0xa6e6,0xa4e0,0xd260,0xea65,0xd530,0x5aa0,0x76a3,0x96d0,0x4afb,0x4ad0,0xa4d0,0x1d0b6,0xd250,0xd520,0xdd45,0xb5a0,0x56d0,0x55b2,0x49b0,0xa577,0xa4b0,0xaa50,0x1b255,0x6d20,0xada0,0x14b63,0x9370,0x49f8,0x4970,0x64b0,0x168a6,0xea50,0x6b20,0x1a6c4,0xaae0,0x92e0,0xd2e3,0xc960,0xd557,0xd4a0,0xda50,0x5d55,0x56a0,0xa6d0,0x55d4,0x52d0,0xa9b8,0xa950,0xb4a0,0xb6a6,0xad50,0x55a0,0xaba4,0xa5b0,0x52b0,0xb273,0x6930,0x7337,0x6aa0,0xad50,0x14b55,0x4b60,0xa570,0x54e4,0xd160,0xe968,0xd520,0xdaa0,0x16aa6,0x56d0,0x4ae0,0xa9d4,0xa4d0,0xd150,0xf252,0xd520];
  function lYearDays(y) { let s = 348; for (let i = 0x8000; i > 0x8; i >>= 1) { if (lunarInfo[y - 1900] & i) s += 1; } return s; }
  function leapMonth(y) { return lunarInfo[y - 1900] & 0xf; }
  function leapDays(y) { if (leapMonth(y)) return (lunarInfo[y - 1900] & 0x10000) ? 30 : 29; return 0; }
  function monthDays(y, m) { return (lunarInfo[y - 1900] & (0x10000 >> m)) ? 30 : 29; }
  function lunar2solar(y, m, d, isLeap) {
    let offset = 0;
    for (let i = 1900; i < y; i++) offset += lYearDays(i) + leapDays(i);
    const leap = leapMonth(y);
    for (let i = 1; i < m; i++) {
      offset += monthDays(y, i);
      if (i === leap) offset += leapDays(y);
    }
    if (isLeap) offset += leapDays(y);
    offset += d - 1;
    const base = new Date(1900, 0, 31);
    base.setDate(base.getDate() + offset);
    return base;
  }
  function nextQixi(now) {
    const y0 = now.getFullYear() - 1;
    for (let y = y0; y <= y0 + 2; y++) {
      const d = lunar2solar(y, 7, 7, false);
      if (d.getTime() > now.getTime()) return d;
    }
    return null;
  }
  function daysUntil(now, target) {
    const diff = target.getTime() - now.getTime();
    return Math.max(0, Math.ceil(diff / 86400000));
  }
  function nextAnniversary(start, now) {
    let a = new Date(now.getFullYear(), start.getMonth(), start.getDate());
    if (a.getTime() < now.getTime() - 86400000) a = new Date(now.getFullYear() + 1, start.getMonth(), start.getDate());
    return a;
  }

  function renderAll() {
    const s = S.settings || {};
    const u = users || {};
    $('#topTitle').textContent = s.homeTitle || '我们的七夕';
    document.title = s.homeTitle || '我们的七夕';
    $('#whoHis').textContent = (u.his && u.his.name) || '他';
    $('#whoHer').textContent = (u.her && u.her.name) || '她';
    renderTab();
  }

  function renderTab() {
    const map = { home: renderHome, photos: renderPhotos, timeline: renderTimeline, checklist: renderChecklist, messages: renderMessages, admin: renderAdmin };
    (map[tab] || renderHome)();
    document.querySelectorAll('.tab').forEach((b) => b.classList.toggle('active', b.dataset.tab === tab));
  }

  function switchTab(t) { tab = t; renderTab(); window.scrollTo(0, 0); }

  function avatarEl(user) {
    const wrap = el('div', 'avatar-wrap');
    if (user && user.avatar) {

    wrap.append(el('span', 'avatar-name', (user && user.name) || ''));

  }

  /* ---------------- 首页 ---------------- */
  function renderHome() {

    view.append(el('div', 'hero'));

    const timerCard = el('div', 'card timer-card');

    body.lastChild.append(el('b', null, '0'), document.createTextNode('天 '), el('b', null, '0'), document.createTextNode('时 '), el('b', null, '0'), document.createTextNode('分 '), el('b', null, '0'), document.createTextNode('秒'));
    timerCard.append(body);
    view.append(timerCard);

    const cds = el('div', 'countdowns');
    const cd1 = el('div', 'cd-card');
    cd1.append(el('div', 'cd-ico', '🌙'), el('div', 'cd-num', '--'), el('div', 'cd-label', '距离下一个七夕'));
    const cd2 = el('div', 'cd-card');
    cd2.append(el('div', 'cd-ico', '💍'), el('div', 'cd-num', '--'), el('div', 'cd-label', '距离纪念日'));
    cds.append(cd1, cd2);
    view.append(cds);

    const grid = el('div', 'nav-grid');
    const cards = [
      ['photos', '📷', '恋爱相册', S.counts.photos],
      ['timeline', '🌙', '点点滴滴', S.counts.timeline],
      ['checklist', '🎯', '恋爱清单', S.counts.checklist],
      ['messages', '💌', '留言板', S.counts.messages],
    ];
    const subs = {
      photos: '记录最美的瞬间',
      timeline: '有人愿意听你碎碎念',
      checklist: '你我之间的约定',
      messages: '在这里写下我们的祝福',
    };
    const icoCls = ['nc-ico-a', 'nc-ico-b', 'nc-ico-c', 'nc-ico-d'];
    cards.forEach(([t, ico, name, count], i) => {
      const c = el('a', 'nav-card');
      c.href = 'javascript:void(0)';
      c.append(
        el('div', 'nc-ico ' + icoCls[i % 4], ico),
        el('div', 'nc-name', name),
        el('div', 'nc-sub', subs[t] || ''),
        el('div', 'nc-count', count + ' 条')
      );
      c.addEventListener('click', () => switchTab(t));
      grid.append(c);
    });
    view.append(grid);

    if (s.startDate) {
      timerCard.hidden = false;
      cd2.hidden = false;
      const nums = body.querySelectorAll('.timer-big b');
      const tick = () => {
        const start = parseDate(s.startDate);
        if (!start) return;
        const now = new Date();
        const ms = now - start;
        nums[0].textContent = Math.floor(ms / 86400000);          // 天
        nums[1].textContent = Math.floor(ms / 3600000) % 24;      // 时
        nums[2].textContent = Math.floor(ms / 60000) % 60;        // 分
        nums[3].textContent = Math.floor(ms / 1000) % 60;         // 秒
        const q = nextQixi(now);
        cd1.querySelector('.cd-num').textContent = q ? daysUntil(now, q) : '--';
        const anni = nextAnniversary(start, now);
        cd2.querySelector('.cd-num').textContent = daysUntil(now, anni);
        cd2.querySelector('.cd-label').textContent = (anni.getFullYear() - start.getFullYear()) + ' 周年纪念日';
      };
      tick();
      window._loveTimer && clearInterval(window._loveTimer);
      window._loveTimer = setInterval(() => { if (tab === 'home') tick(); }, 1000);
    } else {
      timerCard.hidden = true;
      cd2.hidden = true;

  function compressImage(file, maxW) {
    maxW = maxW || 1920;
    return new Promise((resolve, reject) => {
      const img = new Image();
      img.onload = () => {
        const scale = Math.min(1, maxW / img.width);
        const w = Math.max(1, Math.round(img.width * scale));
        const h = Math.max(1, Math.round(img.height * scale));
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        URL.revokeObjectURL(img.src);
        canvas.toBlob((blob) => { if (!blob) return reject(new Error('图片压缩失败')); resolve(blob); }, 'image/jpeg', 0.82);
      };
      img.onerror = () => { URL.revokeObjectURL(img.src); reject(new Error('图片无法读取')); };
      img.src = URL.createObjectURL(file);
    });
  }

  /* ---------------- 登录 ---------------- */
  function openLogin() {
    $('#loginPw').value = '';
    $('#loginModal').hidden = false;
    updateWho();
  }
  function updateWho() {
    document.querySelectorAll('#loginWho button').forEach((b) => {
      const k = b.dataset.who;
      const u = (users && users[k]) || {};
      b.classList.toggle('active', k === loginWho);
      b.innerHTML = '';
      const av = el('span', 'who-av');
      if (u.avatar) {
        const img = el('img');
        img.src = u.avatar;
        av.append(img);
      } else {
        av.textContent = k === 'his' ? '👦' : '👧';
      }
      b.append(av, el('span', null, u.name || (k === 'his' ? '他' : '她')));
    });
  }

  async function doLogin() {
    const btn = $('#loginBtn');
    btn.disabled = true;
    try {
      const data = dbCache || await readData();
      const p = data.profiles[loginWho];
      if (!p || !p.salt) throw new Error('账号未初始化，请刷新页面');
      if (p.passHash !== await hashPw($('#loginPw').value, p.salt)) throw new Error('密码错误');
      me = loginWho;
      localStorage.setItem('gh_me', loginWho);
      $('#loginModal').hidden = true;
      tab = 'admin';
      renderTab();                        // 立即显示管理页（用缓存数据，秒开）
      toast('欢迎回来 💕');
      loadAll().catch(() => { /* 后台静默刷新 */ });  // 后台拉最新数据
    } catch (e) { toast(e.message); }
    finally { btn.disabled = false; }
  }

  /* ---------------- 事件绑定 ---------------- */
  document.querySelectorAll('.tab').forEach((b) => b.addEventListener('click', () => {
    const t = b.dataset.tab;
    if (t === 'admin') { openAdmin(); return; }
    switchTab(t);
  }));
  $('#loginWho').addEventListener('click', (e) => {
    const b = e.target.closest('button[data-who]');
    if (b) { loginWho = b.dataset.who; updateWho(); }
  });
  $('#loginBtn').addEventListener('click', doLogin);
  $('#loginPw').addEventListener('keydown', (e) => { if (e.key === 'Enter') doLogin(); });
  $('#loginCancel').addEventListener('click', () => { $('#loginModal').hidden = true; });
  $('#lbClose').addEventListener('click', () => { $('#lightbox').hidden = true; });
  $('#lbLikeBtn').addEventListener('click', () => {
    const p = lbPhoto;
    if (!p) return;
    const likes = p.likes || (p.likes = []);
    const nowLiked = toggleVisitorLike(likes);
    $('#lbLikeBtn').textContent = '❤️ ' + likes.length;
    $('#lbLikeBtn').classList.toggle('liked', nowLiked);
    persistData('like photo').catch(() => {});
  });
  $('#lightbox').addEventListener('click', (e) => { if (e.target === $('#lightbox')) $('#lightbox').hidden = true; });

  /* ---------------- 漂浮爱心 ---------------- */
  const hearts = ['💕', '💖', '💗', '💘', '💝', '🌹'];
  const bg = $('#bgHearts');
  for (let i = 0; i < 8; i++) {
    const sp = document.createElement('span');
    sp.textContent = hearts[i % hearts.length];
    sp.style.left = Math.random() * 100 + '%';
    sp.style.fontSize = (12 + Math.random() * 16) + 'px';
    sp.style.animationDuration = (11 + Math.random() * 12) + 's';
    sp.style.animationDelay = (Math.random() * 12) + 's';
    bg.append(sp);
  }

  /* ---------------- 启动 ---------------- */
  (async function boot() {
    try {
      if (GH.token === '__GITHUB_TOKEN__') {
        view.innerHTML = '';
        const er = el('div', 'empty');
        er.append(el('span', 'big', '⚙️'));
        er.append(el('div', null, '还没有填写 GitHub 令牌'));
        er.append(el('div', null, '打开 web/index.html，填入 GH.token（见 README 第 2 步）'));
        view.append(er);
        return;
      }
      me = localStorage.getItem('gh_me') || null;
      // 先显示加载提示，避免白屏等待
      const loading = el('div', 'empty');
      loading.append(el('span', 'big', '💕'));
      loading.append(el('div', null, '正在加载…'));
      view.append(loading);
      await loadAll();
    } catch (e) {
      view.innerHTML = '';
      const er = el('div', 'empty');
      er.append(el('span', 'big', '😢'));
      er.append(el('div', null, '加载失败：' + e.message));
      view.append(er);
    }
  })();
})();
</script>
</body>
</html>
